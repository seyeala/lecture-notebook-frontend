name: Frontend Build Baseline

on:
  pull_request:
    paths:
      - "app/**"
      - "api/**"
      - "tools/**"
      - ".github/workflows/frontend-build.yml"
      - "project-docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Flutter web build
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          rustc --version || true
          cargo --version || true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Install OneNote web toolchain
        run: |
          rustup toolchain install nightly --component rust-src
          cargo install wasm-pack --locked

      - name: Build OneNote web library
        run: dart run tools/build_onenote_web.dart

      - name: Prepare nightly web assets
        working-directory: app
        run: cp -rf web_nightly/* web/

      - name: Capture commit hash
        run: echo "GIT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build Flutter web target
        working-directory: app
        run: |
          flutter build web --wasm --release --no-web-resources-cdn \
            --dart-define=flavor=nightly \
            --dart-define=version="$GIT_HASH"

      - name: Verify build output
        run: |
          test -d app/build/web
          test -f app/build/web/index.html
          du -sh app/build/web

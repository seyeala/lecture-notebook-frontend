name: Release (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Release automation intentionally disabled
        run: |
          echo "The upstream Butterfly release workflow is disabled for this fork."
          echo "Do not re-enable release, tagging, version bump, or webhook automation until the Lecture Notebook release process is designed, reviewed, and documented."
          echo "See project-docs/08-decisions/ADR-0004-disable-upstream-release-pipeline.md."
